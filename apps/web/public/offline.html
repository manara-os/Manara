<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline — Manara OS</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #ffffff; color: #111827;
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b0d10; color: #e6e9ee; }
    .btn { background: #f59e0b; color: #1a1206; }
    .card { border-color: #23262b; }
  }
  .card { max-width: 380px; text-align: center; }
  .mark {
    width: 60px; height: 60px; border-radius: 15px; background: #D97706;
    display: grid; place-items: center; margin: 0 auto 18px;
  }
  .mark svg { width: 30px; height: 30px; }
  h1 { font-size: 19px; margin: 0 0 8px; }
  p { color: #6b7280; margin: 0 0 22px; }
  .btn {
    display: inline-block; background: #D97706; color: #fff; text-decoration: none;
    font-weight: 650; font-size: 14px; padding: 11px 22px; border-radius: 10px; border: none; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="#fff"><circle cx="50" cy="26" r="15"/><rect x="46.5" y="4" width="7" height="10"/><path d="M38 38 h24 l3 52 h-30 z"/><rect x="30" y="56" width="40" height="6"/><rect x="46" y="40" width="8" height="14" fill="#D97706"/></svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>Manara OS needs a connection to load your properties, leases and tenants. Reconnect and try again.</p>
    <button class="btn" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
