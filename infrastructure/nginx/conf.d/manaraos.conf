# ── Main domain: manaraos.ae ──────────────────────────────────
server {
  listen 80;
  server_name manaraos.ae www.manaraos.ae;
  return 301 https://$server_name$request_uri;
}

server {
  listen 443 ssl http2;
  server_name manaraos.ae www.manaraos.ae;

  ssl_certificate /etc/nginx/certs/manaraos.ae.crt;
  ssl_certificate_key /etc/nginx/certs/manaraos.ae.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;

  # Web app
  location / {
    proxy_pass http://web_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
  }
}

# ── API: api.manaraos.ae ──────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name api.manaraos.ae;

  ssl_certificate /etc/nginx/certs/api.manaraos.ae.crt;
  ssl_certificate_key /etc/nginx/certs/api.manaraos.ae.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Rate limiting
  location /api/v1/auth/ {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    client_max_body_size 50M;
  }

  # WebSocket support for realtime
  location /socket.io/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
  }
}

# ── Subdomain routing: {slug}.manaraos.ae ────────────────────
server {
  listen 443 ssl http2;
  server_name ~^(?<workspace>[a-z0-9-]+)\.manaraos\.ae$;

  ssl_certificate /etc/nginx/certs/wildcard.manaraos.ae.crt;
  ssl_certificate_key /etc/nginx/certs/wildcard.manaraos.ae.key;

  location / {
    proxy_pass http://web_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Workspace-Slug $workspace;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
