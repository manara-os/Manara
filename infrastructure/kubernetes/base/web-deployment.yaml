apiVersion: apps/v1
kind: Deployment
metadata:
  name: manara-web
  namespace: manara
  labels:
    app: manara-web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: manara-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: manara-web
        tier: frontend
    spec:
      containers:
        - name: web
          image: registry.manaraos.ae/manara-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: manara-web-config
            - secretRef:
                name: manara-web-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      imagePullSecrets:
        - name: registry-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: manara-web
  namespace: manara
spec:
  selector:
    app: manara-web
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
