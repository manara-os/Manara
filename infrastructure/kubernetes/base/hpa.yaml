apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: manara-api-hpa
  namespace: manara
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: manara-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: manara-web-hpa
  namespace: manara
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: manara-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
