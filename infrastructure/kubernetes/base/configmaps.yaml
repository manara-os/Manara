apiVersion: v1
kind: ConfigMap
metadata:
  name: manara-api-config
  namespace: manara
data:
  NODE_ENV: "production"
  PORT: "3001"
  EJARI_MOCK_MODE: "false"
  CORS_ORIGINS: "https://app.manaraos.ae,https://*.manaraos.ae"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: manara-web-config
  namespace: manara
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://api.manaraos.ae/api/v1"
  NEXT_PUBLIC_WS_URL: "wss://api.manaraos.ae"
