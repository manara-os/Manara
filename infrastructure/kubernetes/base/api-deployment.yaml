apiVersion: apps/v1
kind: Deployment
metadata:
  name: manara-api
  namespace: manara
  labels:
    app: manara-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: manara-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: manara-api
        tier: backend
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: registry.manaraos.ae/manara-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - secretRef:
                name: manara-api-secrets
            - configMapRef:
                name: manara-api-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      imagePullSecrets:
        - name: registry-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: manara-api
  namespace: manara
spec:
  selector:
    app: manara-api
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: manara-api-pdb
  namespace: manara
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: manara-api
