apiVersion: apps/v1
kind: Deployment
metadata:
  name: manara-worker
  namespace: manara
  labels:
    app: manara-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: manara-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: manara-worker
        tier: worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: registry.manaraos.ae/manara-api:latest
          imagePullPolicy: Always
          command: ["node", "dist/worker.js"]
          envFrom:
            - secretRef:
                name: manara-api-secrets
            - configMapRef:
                name: manara-api-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 60
      imagePullSecrets:
        - name: registry-credentials
